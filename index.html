<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oracle Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background: linear-gradient(135deg, #24152f, #3d234d 45%, #172b3d);
  color: white;
  text-align: center;
  padding: 28px 16px 50px;
}

.wrap {
  max-width: 850px;
  margin: auto;
}

h1 {
  margin: 0 0 8px;
  font-size: clamp(2rem, 7vw, 3.6rem);
  letter-spacing: 0.08em;
}

.intro {
  opacity: 0.88;
  margin-bottom: 24px;
}

.deck-tabs {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 999px;
  padding: 10px 18px;
  color: white;
  background: rgba(255,255,255,0.12);
}

button:hover {
  background: rgba(255,255,255,0.22);
}

.active {
  background: rgba(255,255,255,0.30);
}

.card {
  min-height: 430px;
  max-width: 520px;
  margin: 20px auto;
  padding: 34px 24px;
  border-radius: 28px;
  border: 2px solid rgba(255,255,255,0.55);
  background: linear-gradient(
    160deg,
    rgba(255,255,255,0.18),
    rgba(255,255,255,0.07)
  );
  box-shadow: 0 18px 55px rgba(0,0,0,0.35);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.number {
  font-size: 1rem;
  letter-spacing: 0.18em;
  opacity: 0.8;
}

.symbol {
  font-size: 5rem;
  margin: 20px 0;
}

.name {
  font-size: clamp(2rem, 8vw, 3.5rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0;
}

.deck-name {
  margin-top: 16px;
  opacity: 0.75;
}

.controls {
  margin: 22px auto;
}

.draw {
  font-size: 1.2rem;
  padding: 13px 28px;
  background: rgba(255,255,255,0.20);
}

.numbers {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 7px;
  max-width: 620px;
  margin: 16px auto;
}

.numbers button {
  padding: 9px 4px;
  border-radius: 10px;
  font-size: 0.95rem;
}

.hint {
  opacity: 0.7;
  font-size: 0.9rem;
  margin-top: 20px;
}

@media (max-width: 560px) {

  .numbers {
    grid-template-columns: repeat(5, 1fr);
  }

  .card {
    min-height: 390px;
  }

}
</style>
</head>


<body>

<div class="wrap">

  <h1>✦ ORACLE ✦</h1>

  <p class="intro">
    Choose a deck, then draw a card.
  </p>


  <div class="deck-tabs">

    <button
      id="archetypesTab"
      class="active"
      onclick="setDeck('archetypes')">
      ✦ Archetypes
    </button>

    <button
      id="animalsTab"
      onclick="setDeck('animals')">
      🐾 Animals
    </button>

  </div>


  <div class="card">

    <div class="number" id="number">
      ARCHETYPES · 1
    </div>

    <div class="symbol" id="symbol">
      🏹
    </div>

    <h2 class="name" id="name">
      Hunter
    </h2>

    <div class="deck-name">
      Your card
    </div>

  </div>


  <div class="controls">

    <button
      class="draw"
      onclick="randomDraw()">
      🎲 Random Draw
    </button>

  </div>


  <div
    class="numbers"
    id="numbers">
  </div>


  <p class="hint">
    You can draw the same card again as often as you like.
  </p>

</div>


<script>

const decks = {

  archetypes: [

    ["Hunter", "🏹"],
    ["Leader", "👑"],
    ["Child", "🌱"],
    ["Guardian", "🛡️"],
    ["Gatherer", "🌾"],
    ["Observer", "👁️"],
    ["Caregiver", "💗"],
    ["Servant", "🤲"],
    ["Explorer", "🧭"],
    ["Dancer", "💃"],
    ["Romantic", "🌹"],
    ["Sage", "🔮"],
    ["Vanquished", "⚔️"],
    ["Wrestler", "🥊"],
    ["Nester", "🪺"],
    ["Devotee", "🙏"],
    ["Idol", "✨"],
    ["Worshipper", "🕯️"],
    ["Trickster", "🃏"],
    ["Apparition", "👻"]

  ],


  animals: [

    ["Canine", "🐕"],
    ["Feline", "🐈"],
    ["Horse", "🐎"],
    ["Frog", "🐸"],
    ["Rabbit", "🐇"],
    ["Elephant", "🐘"],
    ["Octopus", "🐙"],
    ["Lizard", "🦎"],
    ["Griffin", "🦅"],
    ["Bat", "🦇"],
    ["Bird", "🐦"],
    ["Gorilla", "🦍"],
    ["Bear", "🐻"],
    ["Reindeer", "🦌"],
    ["Fox", "🦊"],
    ["Sloth", "🦥"],
    ["Badger", "🦡"],
    ["Tortoise", "🐢"],
    ["Squirrel", "🐿️"],
    ["Seal", "🦭"]

  ]

};


let currentDeck = "archetypes";


function showCard(index) {

  const card = decks[currentDeck][index];

  document.getElementById("number").textContent =
    currentDeck.toUpperCase() + " · " + (index + 1);

  document.getElementById("symbol").textContent =
    card[1];

  document.getElementById("name").textContent =
    card[0];

}


function randomDraw() {

  const index =
    Math.floor(
      Math.random() *
      decks[currentDeck].length
    );

  showCard(index);

}


function setDeck(deck) {

  currentDeck = deck;

  document
    .getElementById("archetypesTab")
    .classList
    .toggle(
      "active",
      deck === "archetypes"
    );

  document
    .getElementById("animalsTab")
    .classList
    .toggle(
      "active",
      deck === "animals"
    );

  buildNumbers();

  showCard(0);

}


function buildNumbers() {

  const container =
    document.getElementById("numbers");

  container.innerHTML = "";

  decks[currentDeck].forEach(
    function(card, index) {

      const button =
        document.createElement("button");

      button.textContent =
        index + 1;

      button.onclick =
        function() {
          showCard(index);
        };

      container.appendChild(button);

    }
  );

}


buildNumbers();

showCard(0);

</script>

</body>
</html>
