<div id="archetypes-oracle-widget">

  <style>
    #archetypes-oracle-widget {
      --ink: #292438;
      --muted: #716b7f;
      --paper: #f7f3ec;
      --white: #ffffff;
      --gold: #c69b54;
      --violet: #7663a8;
      --rose: #c98291;
      --blue: #668ca8;
      --sage: #78927f;
      --terracotta: #bd765e;
      --deep: #403653;

      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 18px;
      box-sizing: border-box;
    }

    #archetypes-oracle-widget *,
    #archetypes-oracle-widget *::before,
    #archetypes-oracle-widget *::after {
      box-sizing: border-box;
    }

    .oracle-decks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .oracle-deck {
      position: relative;
      padding: 24px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.8), transparent 28%),
        linear-gradient(145deg, #fbf8f2, #eee8df);
      box-shadow:
        0 18px 50px rgba(48,39,65,.10),
        inset 0 1px 0 rgba(255,255,255,.8);
      border: 1px solid rgba(60,48,76,.10);
      overflow: hidden;
    }

    .oracle-deck::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid rgba(118,99,168,.09);
      top: -130px;
      right: -100px;
      pointer-events: none;
    }

    .oracle-deck::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(198,155,84,.09);
      bottom: -100px;
      left: -80px;
      pointer-events: none;
    }

    .oracle-heading {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 20px;
    }

    .oracle-kicker {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .oracle-heading h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: .02em;
    }

    .oracle-heading p {
      margin: 7px 0 0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .05em;
    }

    /* CARD */

    .oracle-card {
      --c1: #7663a8;
      --c2: #c98291;
      --c3: #f0d59c;

      position: relative;
      z-index: 2;
      width: min(100%, 330px);
      aspect-ratio: 2 / 3;
      margin: 0 auto 22px;
      padding: 11px;
      border-radius: 19px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.7), rgba(255,255,255,.05)),
        linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow:
        0 20px 35px rgba(45,35,55,.18),
        0 5px 12px rgba(45,35,55,.10);
      transition:
        transform .45s ease,
        box-shadow .45s ease;
    }

    .oracle-card.reveal {
      animation: oracleReveal .55s ease;
    }

    @keyframes oracleReveal {
      0% {
        opacity: .5;
        transform: translateY(8px) scale(.97) rotate(-.6deg);
      }
      55% {
        transform: translateY(-3px) scale(1.01) rotate(.3deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    .oracle-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 13px;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 50% 28%,
          rgba(255,255,255,.18),
          transparent 27%),
        linear-gradient(150deg,
          rgba(20,17,35,.18),
          rgba(20,17,35,.58));
      border: 1px solid rgba(255,255,255,.42);
    }

    .oracle-card-inner::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 9px;
      pointer-events: none;
    }

    .oracle-card-inner::after {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      pointer-events: none;
    }

    .card-number {
      position: absolute;
      top: 21px;
      left: 25px;
      z-index: 5;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .16em;
      opacity: .82;
    }

    .card-art {
      position: absolute;
      left: 50%;
      top: 43%;
      width: 67%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
    }

    .art-circle {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.52);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.035),
        0 0 0 20px rgba(255,255,255,.025);
    }

    .art-orbit {
      position: absolute;
      inset: 2%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.20);
      transform: rotate(25deg) scaleY(.48);
    }

    .art-orbit-two {
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.16);
      transform: rotate(-45deg) scaleY(.48);
    }

    .art-symbol {
      position: absolute;
      inset: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 64px);
      font-weight: normal;
      color: rgba(255,255,255,.94);
      text-shadow:
        0 2px 10px rgba(0,0,0,.22);
    }

    /* Symbol language */

    .symbol {
      position: relative;
      width: 1em;
      height: 1em;
      display: block;
    }

    .symbol::before,
    .symbol::after {
      content: "";
      position: absolute;
    }

    /* Crescent */
    .crescent::before {
      width: .58em;
      height: .58em;
      border: .045em solid rgba(255,255,255,.9);
      border-radius: 50%;
      left: .21em;
      top: .21em;
    }

    .crescent::after {
      width: .48em;
      height: .48em;
      border-radius: 50%;
      background: rgba(75,62,95,.72);
      left: .34em;
      top: .14em;
    }

    /* Arrow */
    .arrow::before {
      width: .08em;
      height: .72em;
      background: #fff;
      left: .46em;
      top: .14em;
      transform: rotate(45deg);
    }

    .arrow::after {
      width: .25em;
      height: .25em;
      border-top: .07em solid #fff;
      border-right: .07em solid #fff;
      right: .08em;
      top: .08em;
      transform: rotate(45deg);
    }

    /* Sun */
    .sun::before {
      width: .38em;
      height: .38em;
      border: .055em solid #fff;
      border-radius: 50%;
      left: .31em;
      top: .31em;
    }

    .sun::after {
      width: .72em;
      height: .72em;
      border: .035em dashed rgba(255,255,255,.7);
      border-radius: 50%;
      left: .14em;
      top: .14em;
    }

    /* Shield */
    .shield::before {
      width: .52em;
      height: .62em;
      border: .055em solid #fff;
      left: .24em;
      top: .16em;
      border-radius: 48% 48% 55% 55%;
      transform: rotate(45deg);
    }

    /* Eye */
    .eye::before {
      width: .7em;
      height: .42em;
      border: .05em solid #fff;
      border-radius: 70% 15%;
      transform: rotate(45deg);
      left: .15em;
      top: .29em;
    }

    .eye::after {
      width: .17em;
      height: .17em;
      background: #fff;
      border-radius: 50%;
      left: .42em;
      top: .42em;
    }

    /* Heart */
    .heart::before {
      width: .48em;
      height: .48em;
      border-left: .055em solid #fff;
      border-bottom: .055em solid #fff;
      transform: rotate(-45deg);
      left: .26em;
      top: .22em;
    }

    .heart::after {
      width: .29em;
      height: .29em;
      border: .055em solid #fff;
      border-radius: 50%;
      left: .20em;
      top: .17em;
      box-shadow: .25em 0 0 -0.01em rgba(255,255,255,.0);
    }

    /* Compass */
    .compass::before {
      width: .58em;
      height: .58em;
      border: .04em solid #fff;
      border-radius: 50%;
      left: .21em;
      top: .21em;
    }

    .compass::after {
      width: .06em;
      height: .68em;
      background: #fff;
      left: .47em;
      top: .16em;
      transform: rotate(45deg);
    }

    /* Flame */
    .flame::before {
      width: .43em;
      height: .62em;
      border: .05em solid #fff;
      border-radius: 60% 40% 60% 40%;
      transform: rotate(20deg);
      left: .29em;
      top: .16em;
    }

    .flame::after {
      width: .15em;
      height: .25em;
      background: rgba(255,255,255,.7);
      border-radius: 50%;
      left: .43em;
      top: .45em;
    }

    /* Nest */
    .nest::before {
      width: .7em;
      height: .35em;
      border: .05em solid #fff;
      border-top: 0;
      border-radius: 0 0 50% 50%;
      left: .15em;
      top: .46em;
    }

    .nest::after {
      width: .22em;
      height: .30em;
      border: .045em solid #fff;
      border-radius: 50%;
      left: .39em;
      top: .25em;
    }

    /* Mask */
    .mask::before {
      width: .68em;
      height: .48em;
      border: .05em solid #fff;
      border-radius: 45% 45% 55% 55%;
      left: .16em;
      top: .25em;
    }

    .mask::after {
      width: .09em;
      height: .28em;
      background: #fff;
      left: .46em;
      top: .35em;
    }

    /* Broken crown */
    .crown::before {
      width: .65em;
      height: .42em;
      border: .05em solid #fff;
      border-top: 0;
      left: .17em;
      top: .40em;
      clip-path: polygon(0 0, 25% 40%, 45% 0, 65% 40%, 100% 0, 88% 100%, 12% 100%);
    }

    .crown::after {
      width: .14em;
      height: .14em;
      border-top: .05em solid #fff;
      border-left: .05em solid #fff;
      left: .45em;
      top: .20em;
      transform: rotate(45deg);
    }

    /* Spiral */
    .spiral::before {
      width: .58em;
      height: .58em;
      border: .05em solid #fff;
      border-radius: 50%;
      left: .21em;
      top: .21em;
      clip-path: inset(0 0 45% 0);
    }

    .spiral::after {
      width: .25em;
      height: .25em;
      border: .05em solid #fff;
      border-radius: 50%;
      left: .36em;
      top: .36em;
    }

    /* Radial */
    .radial::before {
      width: .62em;
      height: .62em;
      border: .045em solid #fff;
      border-radius: 50%;
      left: .19em;
      top: .19em;
    }

    .radial::after {
      width: .08em;
      height: .72em;
      background: #fff;
      left: .46em;
      top: .14em;
      box-shadow:
        0 0 0 .01em transparent;
      transform: rotate(45deg);
    }

    /* Wave */
    .wave::before {
      width: .75em;
      height: .35em;
      border-top: .05em solid #fff;
      border-radius: 50%;
      left: .12em;
      top: .30em;
      transform: rotate(-10deg);
    }

    .wave::after {
      width: .55em;
      height: .25em;
      border-top: .04em solid rgba(255,255,255,.65);
      border-radius: 50%;
      left: .22em;
      top: .51em;
    }

    /* Star */
    .star-symbol::before {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: .75em;
      color: #fff;
    }

    /* Generic animal sigil */
    .animal-sigil::before {
      width: .62em;
      height: .62em;
      border: .045em solid #fff;
      border-radius: 50%;
      left: .19em;
      top: .19em;
    }

    .animal-sigil::after {
      content: "✦";
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .38em;
      color: #fff;
    }

    .star {
      position: absolute;
      color: rgba(255,255,255,.7);
      font-size: 7px;
    }

    .star.s1 { top: 25%; left: 20%; }
    .star.s2 { top: 17%; right: 21%; font-size: 5px; }
    .star.s3 { bottom: 28%; left: 18%; font-size: 5px; }
    .star.s4 { bottom: 19%; right: 23%; }

    .card-title {
      position: absolute;
      z-index: 5;
      left: 24px;
      right: 24px;
      bottom: 42px;
      text-align: center;
      font-size: clamp(22px, 4vw, 31px);
      line-height: 1.05;
      font-weight: 500;
      text-shadow: 0 2px 9px rgba(0,0,0,.18);
    }

    .card-type {
      position: absolute;
      z-index: 5;
      bottom: 21px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 8px;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .72;
    }

    /* CONTROLS */

    .draw-button {
      display: block;
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 330px;
      margin: 0 auto 15px;
      padding: 13px 18px;
      border: 1px solid rgba(58,47,73,.18);
      border-radius: 999px;
      background: var(--deep);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .draw-button:hover {
      transform: translateY(-1px);
      background: #55496d;
      box-shadow: 0 8px 20px rgba(50,40,70,.18);
    }

    .draw-button:active {
      transform: translateY(0);
    }

    .number-grid {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      max-width: 330px;
      margin: 0 auto;
    }

    .number-button {
      min-width: 0;
      aspect-ratio: 1;
      border: 1px solid rgba(60,48,76,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 10px;
      cursor: pointer;
      transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
    }

    .number-button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.9);
    }

    .number-button.selected {
      background: var(--deep);
      color: #fff;
      border-color: var(--deep);
    }

    .deck-status {
      position: relative;
      z-index: 3;
      text-align: center;
      min-height: 18px;
      margin-top: 11px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .06em;
    }

    @media (max-width: 760px) {
      #archetypes-oracle-widget {
        padding: 18px 10px;
      }

      .oracle-decks {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .oracle-deck {
        padding: 18px 14px;
      }
    }

    @media (max-width: 360px) {
      .number-grid {
        gap: 4px;
      }

      .number-button {
        border-radius: 6px;
        font-size: 9px;
      }
    }
  </style>


  <div class="oracle-decks">

    <!-- ===================== ARCHETYPES ===================== -->

    <section class="oracle-deck human-deck" data-deck="human">

      <div class="oracle-heading">
        <div class="oracle-kicker">Oracle Deck I</div>

      </div>

    </section>


    <!-- ===================== ANIMALS ===================== -->

    <section class="oracle-deck animal-deck" data-deck="animal">

      <div class="oracle-heading">
        <div class="oracle-kicker">Oracle Deck II</div>
        <h2>Animals</h2>
        <p>Instinct · nature · animal wisdom</p>
      </div>

      <div class="oracle-card animal-card" aria-live="polite">
        <div class="oracle-card-inner">

          <div class="card-number">01</div>

          <div class="card-art">
            <div class="art-orbit"></div>
            <div class="art-orbit-two"></div>
            <div class="art-circle"></div>

            <div class="art-symbol">
              <span class="symbol animal-sigil"></span>
            </div>

            <span class="star s1">✦</span>
            <span class="star s2">·</span>
            <span class="star s3">✦</span>
            <span class="star s4">·</span>
          </div>

          <div class="card-title">Canine</div>
          <div class="card-type">Animal</div>

        </div>
      </div>

      <button class="draw-button" type="button">
        Draw Card
      </button>

      <div class="number-grid" aria-label="Choose an Animal card"></div>

      <div class="deck-status">
        Choose a number or draw at random
      </div>

    </section>

  </div>

        ["#4d5f73", "#697fa2", "#cbbd91"],
        ["#536b61", "#819879", "#d6c58d"],
        ["#5a4f68", "#8971a0", "#ddbf86"],
        ["#465d73", "#687e9a", "#cdbd8b"],
        ["#536c78", "#7a9eab", "#d8c98e"],
        ["#5c554d", "#817967", "#d1b97e"],
        ["#665d51", "#917c62", "#d9c083"],
        ["#5a6470", "#788c9d", "#d7c489"],
        ["#6c514d", "#9c6c65", "#dfbc83"],
        ["#5e6456", "#819071", "#d5c68e"],
        ["#545b62", "#7a8284", "#d2bf91"],
        ["#4e6264", "#758d89", "#d3c58e"],
        ["#5e6651", "#87956a", "#d8c28b"],
        ["#506873", "#7198a0", "#d5c38c"]
      ];


      function createOracleDeck(config) {

        const root = document.querySelector(config.selector);

        if (!root) return;

        const card = root.querySelector(".oracle-card");
        const cardNumber = root.querySelector(".card-number");
        const cardTitle = root.querySelector(".card-title");
        const symbol = root.querySelector(".art-symbol");
        const numberGrid = root.querySelector(".number-grid");
        const drawButton = root.querySelector(".draw-button");
        const status = root.querySelector(".deck-status");

        let current = 1;


        function renderNumberButtons() {

          numberGrid.innerHTML = "";

          config.cards.forEach(function (name, index) {

            const number = index + 1;

            const button = document.createElement("button");

            button.type = "button";
            button.className = "number-button";
            button.textContent = number;

            button.setAttribute(
              "aria-label",
              "Select " + number + ": " + name
            );

            button.addEventListener("click", function () {
              selectCard(number);
            });

            numberGrid.appendChild(button);
          });
        }


        function selectCard(number) {

          current = number;

          const index = number - 1;
          const name = config.cards[index];

          cardNumber.textContent =
            String(number).padStart(2, "0");

          cardTitle.textContent = name;

          symbol.innerHTML =
            '<span class="symbol ' +
            config.symbols[index] +
            '"></span>';

          const palette = config.palettes[index];

          card.style.setProperty("--c1", palette[0]);
          card.style.setProperty("--c2", palette[1]);
          card.style.setProperty("--c3", palette[2]);

          const buttons =
            numberGrid.querySelectorAll(".number-button");

          buttons.forEach(function (button, i) {
            button.classList.toggle(
              "selected",
              i === index
            );
          });

          status.textContent =
            "Card " + number + " · " + name;

          card.classList.remove("reveal");

          void card.offsetWidth;

          card.classList.add("reveal");
        }


        function drawRandom() {

          /*
           * Cards are never removed from the deck.
           * Therefore draws can continue forever and repeats are allowed.
           */

          const number =
            Math.floor(Math.random() * config.cards.length) + 1;

          selectCard(number);
        }


        drawButton.addEventListener(
          "click",
          drawRandom
        );

        renderNumberButtons();

        selectCard(current);
      }


      createOracleDeck({
        selector: ".human-deck",
        cards: humanCards,
        symbols: humanSymbols,
        palettes: humanPalettes
      });


      createOracleDeck({
        selector: ".animal-deck",
        cards: animalCards,
        symbols: animalSymbols,
        palettes: animalPalettes
      });

    })();
  </script>

</div>
