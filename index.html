<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oracle</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b0911;
  --bg2: #151020;
  --panel: #171221;
  --gold: #c9a96a;
  --gold-light: #ead8a7;
  --cream: #eee6d4;
  --muted: #9d94a8;
  --line: rgba(201,169,106,.35);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: Georgia, "Times New Roman", serif;

  background:
    radial-gradient(circle at 20% 10%, rgba(101,72,130,.18), transparent 28%),
    radial-gradient(circle at 85% 80%, rgba(65,91,116,.15), transparent 30%),
    radial-gradient(circle at 50% 50%, #191225 0%, #0b0911 68%);

  padding: 45px 18px 70px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;

  background-image:
    radial-gradient(circle, rgba(255,255,255,.65) 0 1px, transparent 1.5px);

  background-size: 97px 103px;
  background-position: 13px 21px;
}

#oracle {
  width: min(1180px, 100%);
  margin: auto;
  position: relative;
}

.site-title {
  text-align: center;
  margin-bottom: 42px;
}

.site-title .small {
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
}

.site-title h1 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(38px, 7vw, 68px);
  letter-spacing: .12em;
  text-transform: uppercase;

  color: var(--cream);

  text-shadow:
    0 0 25px rgba(201,169,106,.15);
}

.site-title .ornament {
  margin: 16px auto 0;
  width: 150px;
  color: var(--gold);
  font-size: 18px;
  letter-spacing: .3em;
}

.decks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 35px;
}

.deck {
  position: relative;
  padding: 28px 24px 30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  border: 1px solid rgba(201,169,106,.20);
  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 0 40px rgba(255,255,255,.015);

  overflow: hidden;
}

.deck::before,
.deck::after {
  content: "";
  position: absolute;
  pointer-events: none;
  border: 1px solid rgba(201,169,106,.09);
  border-radius: 50%;
}

.deck::before {
  width: 350px;
  height: 350px;
  top: -220px;
  right: -170px;
}

.deck::after {
  width: 280px;
  height: 280px;
  bottom: -180px;
  left: -150px;
}

.deck-heading {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 24px;
}

.deck-heading .kicker {
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.deck-heading h2 {
  margin: 0;
  font-size: clamp(29px, 5vw, 40px);
  font-weight: 400;
  letter-spacing: .05em;
}

.deck-heading p {
  margin: 8px 0 0;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--muted);
}


/* =========================
   CARD
   ========================= */

.oracle-card {
  --c1: #30243f;
  --c2: #684b63;
  --c3: #b38d58;

  position: relative;
  width: min(100%, 350px);
  aspect-ratio: 2 / 3;
  margin: 0 auto 24px;

  padding: 10px;

  background:
    linear-gradient(
      135deg,
      var(--c3),
      #756044 35%,
      var(--c2) 70%,
      #35263f
    );

  box-shadow:
    0 25px 45px rgba(0,0,0,.55),
    0 5px 12px rgba(0,0,0,.4);

  transition: transform .35s ease;
}

.oracle-card:hover {
  transform: translateY(-4px);
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(130,104,155,.30),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(111,73,83,.25),
      transparent 40%
    ),
    linear-gradient(
      160deg,
      #17111f,
      #21172c 50%,
      #100d17
    );

  border: 1px solid rgba(238,214,165,.75);
}


/* Outer ornamental frames */

.card-inner::before {
  content: "";
  position: absolute;
  inset: 8px;

  border: 1px solid rgba(234,216,167,.65);

  pointer-events: none;
}

.card-inner::after {
  content: "";
  position: absolute;
  inset: 15px;

  border: 1px solid rgba(201,169,106,.30);

  pointer-events: none;
}


/* Corner ornaments */

.corner {
  position: absolute;
  z-index: 5;
  color: var(--gold-light);
  font-size: 17px;
  opacity: .85;
}

.corner.tl {
  top: 19px;
  left: 21px;
}

.corner.tr {
  top: 19px;
  right: 21px;
}

.corner.bl {
  bottom: 19px;
  left: 21px;
}

.corner.br {
  bottom: 19px;
  right: 21px;
}


/* Number */

.card-number {
  position: absolute;
  z-index: 6;

  top: 23px;
  left: 50%;

  transform: translateX(-50%);

  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .3em;

  color: var(--gold-light);
}


/* Celestial artwork */

.card-art {
  position: absolute;

  width: 70%;
  aspect-ratio: 1;

  left: 50%;
  top: 44%;

  transform: translate(-50%, -50%);
}

.orbit {
  position: absolute;
  inset: 3%;

  border: 1px solid rgba(234,216,167,.24);
  border-radius: 50%;

  transform: rotate(25deg) scaleY(.45);
}

.orbit.two {
  inset: 11%;
  transform: rotate(-35deg) scaleY(.5);
  border-color: rgba(234,216,167,.20);
}

.orbit.three {
  inset: 20%;
  transform: rotate(90deg) scaleY(.55);
  border-color: rgba(234,216,167,.16);
}

.art-circle {
  position: absolute;
  inset: 15%;

  border: 1px solid rgba(234,216,167,.48);
  border-radius: 50%;

  box-shadow:
    0 0 0 8px rgba(201,169,106,.025),
    0 0 0 20px rgba(201,169,106,.018),
    0 0 35px rgba(201,169,106,.08);
}

.art-circle::before {
  content: "";
  position: absolute;
  inset: 10%;

  border: 1px dashed rgba(234,216,167,.22);
  border-radius: 50%;
}

.art-symbol {
  position: absolute;
  inset: 24%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--gold-light);

  font-size: 65px;

  text-shadow:
    0 0 18px rgba(201,169,106,.28),
    0 2px 8px rgba(0,0,0,.7);
}


/* Decorative rays */

.ray {
  position: absolute;
  left: 50%;
  top: 50%;

  width: 1px;
  height: 92%;

  background: linear-gradient(
    to bottom,
    transparent,
    rgba(234,216,167,.18),
    transparent
  );

  transform-origin: center;
}

.r1 { transform: translate(-50%,-50%) rotate(0deg); }
.r2 { transform: translate(-50%,-50%) rotate(45deg); }
.r3 { transform: translate(-50%,-50%) rotate(90deg); }
.r4 { transform: translate(-50%,-50%) rotate(135deg); }


/* Stars */

.star {
  position: absolute;
  color: rgba(234,216,167,.72);
  font-size: 7px;
}

.star.s1 { left: 18%; top: 27%; }
.star.s2 { right: 19%; top: 22%; font-size: 5px; }
.star.s3 { left: 21%; bottom: 28%; font-size: 5px; }
.star.s4 { right: 17%; bottom: 25%; }
.star.s5 { left: 31%; top: 17%; font-size: 4px; }
.star.s6 { right: 31%; bottom: 17%; font-size: 4px; }


/* Card title */

.card-title {
  position: absolute;
  z-index: 6;

  left: 25px;
  right: 25px;
  bottom: 47px;

  text-align: center;

  color: var(--cream);

  font-size: clamp(23px, 4vw, 32px);
  font-weight: 400;
  letter-spacing: .06em;

  text-shadow:
    0 2px 10px rgba(0,0,0,.7);
}

.card-type {
  position: absolute;
  z-index: 6;

  left: 0;
  right: 0;
  bottom: 25px;

  text-align: center;

  font-family: Arial, sans-serif;
  font-size: 7px;
  letter-spacing: .3em;
  text-transform: uppercase;

  color: var(--gold-light);
  opacity: .75;
}


/* =========================
   SYMBOLS
   ========================= */

.symbol {
  position: relative;
  width: 1em;
  height: 1em;
  display: block;
}

.symbol::before,
.symbol::after {
  content: "";
  position: absolute;
}


/* Moon */

.moon::before {
  width: .62em;
  height: .62em;
  border: .035em solid var(--gold-light);
  border-radius: 50%;
  left: .18em;
  top: .19em;
}

.moon::after {
  width: .52em;
  height: .52em;
  background: #1a1324;
  border-radius: 50%;
  left: .34em;
  top: .10em;
}


/* Crown */

.crown::before {
  width: .68em;
  height: .48em;
  left: .16em;
  top: .35em;

  border: .035em solid var(--gold-light);
  border-top: none;

  clip-path: polygon(
    0 0,
    20% 40%,
    45% 0,
    65% 40%,
    100% 0,
    88% 100%,
    12% 100%
  );
}

.crown::after {
  width: .08em;
  height: .08em;
  background: var(--gold-light);
  border-radius: 50%;

  left: .46em;
  top: .16em;

  box-shadow:
    -.24em .05em 0 var(--gold-light),
    .24em .05em 0 var(--gold-light);
}


/* Seed */

.seed::before {
  width: .42em;
  height: .65em;
  border: .04em solid var(--gold-light);
  border-radius: 70% 30% 70% 30%;
  left: .28em;
  top: .18em;
  transform: rotate(35deg);
}

.seed::after {
  width: .04em;
  height: .65em;
  background: var(--gold-light);
  left: .49em;
  top: .27em;
  transform: rotate(-25deg);
}


/* Shield */

.shield::before {
  width: .57em;
  height: .67em;
  border: .045em solid var(--gold-light);

  left: .22em;
  top: .14em;

  clip-path: polygon(
    0 0,
    100% 0,
    100% 58%,
    50% 100%,
    0 58%
  );
}


/* Eye */

.eye::before {
  width: .72em;
  height: .43em;

  border: .045em solid var(--gold-light);
  border-radius: 70% 15%;

  transform: rotate(45deg);

  left: .14em;
  top: .28em;
}

.eye::after {
  width: .15em;
  height: .15em;

  background: var(--gold-light);
  border-radius: 50%;

  left: .43em;
  top: .43em;
}


/* Heart */

.heart::before {
  width: .47em;
  height: .47em;

  border-left: .045em solid var(--gold-light);
  border-bottom: .045em solid var(--gold-light);

  transform: rotate(-45deg);

  left: .27em;
  top: .25em;
}

.heart::after {
  width: .25em;
  height: .25em;

  border: .045em solid var(--gold-light);
  border-radius: 50%;

  left: .20em;
  top: .17em;

  box-shadow: .27em 0 0 -.01em transparent;
}


/* Compass */

.compass::before {
  width: .62em;
  height: .62em;

  border: .035em solid var(--gold-light);
  border-radius: 50%;

  left: .19em;
  top: .19em;
}

.compass::after {
  width: .05em;
  height: .72em;

  background: var(--gold-light);

  left: .475em;
  top: .14em;

  transform: rotate(45deg);
}


/* Flame */

.flame::before {
  width: .43em;
  height: .62em;

  border: .045em solid var(--gold-light);
  border-radius: 60% 40% 60% 40%;

  transform: rotate(20deg);

  left: .29em;
  top: .16em;
}

.flame::after {
  width: .13em;
  height: .23em;

  background: rgba(234,216,167,.75);
  border-radius: 50%;

  left: .44em;
  top: .46em;
}


/* Spiral */

.spiral::before {
  width: .66em;
  height: .66em;

  border: .045em solid var(--gold-light);
  border-radius: 50%;

  left: .17em;
  top: .17em;
}

.spiral::after {
  width: .25em;
  height: .25em;

  border: .04em solid var(--gold-light);
  border-radius: 50%;

  left: .38em;
  top: .38em;
}


/* Star */

.star-symbol::before {
  content: "✦";

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  color: var(--gold-light);
  font-size: .82em;
}


/* Wave */

.wave::before {
  width: .78em;
  height: .38em;

  border-top: .045em solid var(--gold-light);
  border-radius: 50%;

  left: .10em;
  top: .29em;

  transform: rotate(-8deg);
}

.wave::after {
  width: .58em;
  height: .28em;

  border-top: .035em solid rgba(234,216,167,.65);
  border-radius: 50%;

  left: .20em;
  top: .50em;
}


/* Animal sigil */

.animal::before {
  width: .62em;
  height: .62em;

  border: .04em solid var(--gold-light);
  border-radius: 50%;

  left: .19em;
  top: .19em;
}

.animal::after {
  content: "✦";

  position: absolute;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--gold-light);
  font-size: .45em;
}


/* =========================
   CONTROLS
   ========================= */

.draw-button {
  position: relative;
  z-index: 4;

  display: block;

  width: min(100%, 350px);

  margin: 0 auto 16px;

  padding: 14px 20px;

  border: 1px solid rgba(201,169,106,.48);
  border-radius: 2px;

  background:
    linear-gradient(
      135deg,
      rgba(201,169,106,.15),
      rgba(201,169,106,.04)
    );

  color: var(--gold-light);

  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: .25em;
  text-transform: uppercase;

  cursor: pointer;

  transition:
    background .25s ease,
    border-color .25s ease,
    transform .2s ease;
}

.draw-button:hover {
  background: rgba(201,169,106,.18);
  border-color: rgba(234,216,167,.75);
  transform: translateY(-2px);
}


/* Number grid */

.number-grid {
  position: relative;
  z-index: 4;

  width: min(100%, 350px);

  margin: auto;

  display: grid;
  grid-template-columns: repeat(10, 1fr);

  gap: 5px;
}

.number-button {
  aspect-ratio: 1;

  border: 1px solid rgba(201,169,106,.18);
  border-radius: 2px;

  background: rgba(255,255,255,.025);

  color: var(--muted);

  font-family: Arial, sans-serif;
  font-size: 9px;

  cursor: pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;
}

.number-button:hover {
  color: var(--gold-light);
  border-color: rgba(201,169,106,.55);
  background: rgba(201,169,106,.08);
}

.number-button.selected {
  color: #15101c;
  background: var(--gold);
  border-color: var(--gold);
}


.status {
  position: relative;
  z-index: 3;

  min-height: 17px;

  margin-top: 13px;

  text-align: center;

  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;

  color: var(--muted);
}


/* Card reveal */

.reveal {
  animation: revealCard .65s ease;
}

@keyframes revealCard {

  0% {
    opacity: .35;
    transform:
      translateY(10px)
      rotate(-1deg)
      scale(.97);
  }

  55% {
    opacity: 1;
    transform:
      translateY(-3px)
      rotate(.3deg)
      scale(1.01);
  }

  100% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(0)
      scale(1);
  }
}


/* Mobile */

@media (max-width: 760px) {

  body {
    padding: 28px 10px 50px;
  }

  .site-title {
    margin-bottom: 30px;
  }

  .decks {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .deck {
    padding: 24px 14px 26px;
  }

}

@media (max-width: 370px) {

  .number-grid {
    gap: 3px;
  }

  .number-button {
    font-size: 8px;
  }

}
</style>
</head>


<body>

<div id="oracle">

  <header class="site-title">

    <div class="small">
      Primal
    </div>

    <h1>Oracle</h1>

    <div class="ornament">

    </div>

  </header>


  <main class="decks">


    <!-- =========================

         ========================= -->

    <section

      <div class="deck-heading">

          <div class="card-title">

      <button

      <div

    <!-- =========================

      <div class="oracle-card">

        <div class="card-inner">

          <div class="corner tl">✦</div>
          <div class="corner tr">✧</div>
          <div class="corner bl">✧</div>
          <div class="corner br">✦</div>

          <div class="card-number">
            01
          </div>


          <div class="card-art">

            <div class="orbit"></div>
            <div class="orbit two"></div>
            <div class="orbit three"></div>

            <div class="ray r1"></div>
            <div class="ray r2"></div>
            <div class="ray r3"></div>
            <div class="ray r4"></div>

            <div class="art-circle"></div>

            <div class="art-symbol">
              <span class="symbol animal"></span>
            </div>

            <span class="star s1">✦</span>
            <span class="star s2">·</span>
            <span class="star s3">✧</span>
            <span class="star s4">·</span>
            <span class="star s5">·</span>
            <span class="star s6">✦</span>

          </div>


          <div class="card-title">
            Canine
          </div>

          <div class="card-type">
            Animal
          </div>

        </div>

      </div>


      <button
        class="draw-button"
        type="button"
      >
        Draw Card
      </button>


      <div
        class="number-grid"
        aria-label="Choose an Animal card"
      ></div>


      <div class="status">
        Choose a number or draw at random
      </div>

    </section>

  </main>

</div>

  function setupDeck(
    selector,
    cards,
    symbols,
    palettes,
    typeName
  ) {

    const deck =
      document.querySelector(selector);

    if (!deck) return;


    const card =
      deck.querySelector(".oracle-card");

    const cardNumber =
      deck.querySelector(".card-number");

    const cardTitle =
      deck.querySelector(".card-title");

    const cardSymbol =
      deck.querySelector(".art-symbol");

    const grid =
      deck.querySelector(".number-grid");

    const draw =
      deck.querySelector(".draw-button");

    const status =
      deck.querySelector(".status");


    let current = 0;


    function showCard(index) {

      current = index;

      cardNumber.textContent =
        String(index + 1).padStart(2, "0");

      cardTitle.textContent =
        cards[index];


      cardSymbol.innerHTML =
        '<span class="symbol ' +
        symbols[index] +
        '"></span>';


      card.style.setProperty(
        "--c1",
        palettes[index][0]
      );

      card.style.setProperty(
        "--c2",
        palettes[index][1]
      );

      card.style.setProperty(
        "--c3",
        palettes[index][2]
      );


      const buttons =
        grid.querySelectorAll(
          ".number-button"
        );


      buttons.forEach(
        function (button, buttonIndex) {

          button.classList.toggle(
            "selected",
            buttonIndex === index
          );

        }
      );


      status.textContent =
        "Card " +
        (index + 1) +
        " · " +
        cards[index];


      card.classList.remove("reveal");

      void card.offsetWidth;

      card.classList.add("reveal");
    }


    function buildButtons() {

      cards.forEach(
        function (name, index) {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "number-button";

          button.textContent =
            index + 1;

          button.title =
            name;

          button.setAttribute(
            "aria-label",
            "Choose card " +
            (index + 1) +
            ": " +
            name
          );


          button.addEventListener(
            "click",
            function () {
              showCard(index);
            }
          );


          grid.appendChild(button);

        }
      );

    }


    draw.addEventListener(
      "click",
      function () {

        const randomIndex =
          Math.floor(
            Math.random() *
            cards.length
          );

        showCard(randomIndex);

      }
    );


    buildButtons();

    showCard(current);

  }
